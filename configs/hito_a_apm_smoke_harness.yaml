# Prueba técnica local del circuito completo (perfil → slice → fusión → pass@1/NLL → lock → test → informe)
# con modelos ya descargados del MISMO tamaño (0.5B). Con formas iguales APM elige todos los índices y equivale a
# interpolar: NO mide APM, solo que la tubería funciona. "dev" y "test" salen de la partición de diagnóstico para no
# tocar las particiones reales de desarrollo y test.
experiment: smoke_harness_0p5b
out: results/experiments/hito_a_apm_smoke/harness

donor:    {repo: Qwen/Qwen2.5-Coder-0.5B, revision: 8123ea2e9354afb7ffcc6c8641d1b2f5ecf18301, path: models_cache/Qwen2.5-Coder-0.5B, size_gb: 0.99}
receiver: {repo: Qwen/Qwen2.5-0.5B, revision: 060db6499f32faf8b98477b0a26969ef7d8b9987, path: models_cache/Qwen2.5-0.5B, size_gb: 0.99}

resources: {work_disk_gb: 2, disk_margin_gb: 5, min_ram_gb: 8}
calibration: {split: diagnostic, offset: 0, n: 32, scope: prompt, max_tokens: 512}
probe:       {split: diagnostic, offset: 256, n: 16}
dev:         {split: diagnostic, offset: 320, n: 16}
test:        {split: diagnostic, offset: 352, n: 16}
profile_dtype: bfloat16
methods: [IM, APM]
mu_grid: [0.05, 0.1]
mu_selection_rule: "por método, μ con mayor pass@1 en dev; empate → menor NLL de código en dev; empate → menor μ"
eval: {dtype: float32, max_new_tokens: 256, batch_size: 8}
